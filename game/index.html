<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08121c">
<title>Nightshade Courier — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080f19; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Nightshade Courier. WASD or arrows to move, Shift or C to sneak, Space to collect intel, click to throw a pebble. P pauses; R restarts; M toggles sound.">Your browser needs canvas support to play Nightshade Courier.</canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
